user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    client_max_body_size 50M;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name _;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;

        # 1. SUPERSET STATIC ASSETS
        location /static/assets/ {
            proxy_pass http://superset-qvgc:8088/static/assets/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /static/appbuilder/ {
            proxy_pass http://superset-qvgc:8088/static/appbuilder/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
        }

        # 2. BACKEND API
        location /api/ {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://backend-yf9d:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
        }

        # 3. SUPERSET APP - DON'T REWRITE, PASS AS-IS
        location /superset {
            # NO REWRITE - pass the full path to Superset
            proxy_pass http://superset-qvgc:8088;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # CRITICAL: Force HTTPS so Superset generates https:// URLs
            proxy_set_header X-Forwarded-Proto https;
            
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            
            # Increase timeouts for long queries
            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            
            # NO proxy_redirect - let Superset's URLs pass through
            # NO proxy_cookie_path - Superset sets correct path
            # NO X-Script-Name - Superset knows its own root
        }

        # 4. REACT FRONTEND STATIC
        location /static/ {
            proxy_pass http://frontend-4o0b:3000/static/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
        }

        # 5. FRONTEND (React SPA)
        location / {
            proxy_pass http://frontend-4o0b:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /health {
            return 200 "healthy\n";
        }
    }
}