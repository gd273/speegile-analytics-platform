services:
  # -------------------------------------------------------
  # 1. SUPERSET (Docker)
  # -------------------------------------------------------
  - type: web
    name: superset
    runtime: docker
    rootDir: .
    dockerfilePath: ./Dockerfile
    plan: standard
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: shared-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: shared-redis
          property: connectionString
      - key: SUPERSET_SECRET_KEY
        generateValue: true
      - key: SECRET_KEY
        generateValue: true
      - key: GUEST_TOKEN_JWT_SECRET
        generateValue: true
      - key: SUPERSET_ADMIN_USERNAME
        value: admin
      - key: SUPERSET_ADMIN_PASSWORD
        generateValue: true
      - key: FLASK_ENV
        value: production

  # -------------------------------------------------------
  # 2. BACKEND API (Docker)
  # -------------------------------------------------------
  - type: web
    name: backend
    runtime: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    envVars:
      - key: APP_DATABASE_URL
        fromDatabase:
          name: shared-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: shared-redis
          property: connectionString
      - key: FLASK_ENV
        value: production
      - key: SUPERSET_URL
        fromService:
          type: web
          name: superset
          envVarKey: RENDER_EXTERNAL_URL
      - key: SUPERSET_ADMIN_USERNAME
        value: admin
      - key: SUPERSET_ADMIN_PASSWORD
        sync: false
      - key: GUEST_TOKEN_JWT_SECRET
        sync: false
      - key: CORS_ALLOW_ORIGINS
        value: "*"

  # -------------------------------------------------------
  # 3. FRONTEND (Static Site as Web Service)
  # -------------------------------------------------------
  - type: web
    name: frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_API_BASE_URL
        fromService:
          type: web
          name: backend
          envVarKey: RENDER_EXTERNAL_URL

  # -------------------------------------------------------
  # 4. REDIS (Private Service)
  # -------------------------------------------------------
  - type: redis
    name: shared-redis
    plan: starter
    ipAllowList: []

databases:
  - name: shared-postgres
    plan: free
    databaseName: superset
    user: superset
