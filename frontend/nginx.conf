server {
    listen 3000;
    server_name localhost;
    
    # Root directory of the built React app
    root /usr/share/nginx/html;
    index index.html;

    # 1. Main SPA Routing Fix
    # If the file isn't found (e.g., /dashboards), serve index.html
    # This allows React Router to handle the URL on the client side.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 2. Static Assets Caching (Optional but recommended)
    location /static {
        expires 1y;
        add_header Cache-Control "public";
        access_log off;
    }

    # 3. Health Check (Optional)
    location /health {
        return 200 "OK";
    }
}