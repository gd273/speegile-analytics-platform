# # # # =========================================================
# # # # GATEWAY NGINX CONFIG
# # # # Single public entrypoint
# # # # Routes:
# # # #   /        → Frontend (React)
# # # #   /api/    → Backend (Flask)
# # # #   /superset/ → Apache Superset
# # # # =========================================================

# # # user  nginx;
# # # worker_processes auto;

# # # error_log  /var/log/nginx/error.log warn;
# # # pid        /var/run/nginx.pid;

# # # events {
# # #     worker_connections 1024;
# # # }

# # # http {
# # #     # -----------------------------------------------------
# # #     # Core Settings
# # #     # -----------------------------------------------------
# # #     include       /etc/nginx/mime.types;
# # #     default_type  application/octet-stream;

# # #     sendfile on;
# # #     tcp_nopush on;
# # #     tcp_nodelay on;
# # #     keepalive_timeout 65;
# # #     client_max_body_size 50M;

# # #     # -----------------------------------------------------
# # #     # Logging
# # #     # -----------------------------------------------------
# # #     log_format main '$remote_addr - $remote_user [$time_local] "$request" '
# # #                     '$status $body_bytes_sent "$http_referer" '
# # #                     '"$http_user_agent" "$http_x_forwarded_for"';

# # #     access_log /var/log/nginx/access.log main;

# # #     # -----------------------------------------------------
# # #     # Compression
# # #     # -----------------------------------------------------
# # #     gzip on;
# # #     gzip_vary on;
# # #     gzip_proxied any;
# # #     gzip_comp_level 6;
# # #     gzip_types
# # #         text/plain
# # #         text/css
# # #         text/xml
# # #         application/json
# # #         application/javascript
# # #         application/xml+rss
# # #         image/svg+xml;

# # #     # -----------------------------------------------------
# # #     # WebSocket / Upgrade support
# # #     # -----------------------------------------------------
# # #     map $http_upgrade $connection_upgrade {
# # #         default upgrade;
# # #         ''      close;
# # #     }

# # #     # =====================================================
# # #     # UPSTREAMS
# # #     # NOTE:
# # #     # - Services may NOT be available at startup
# # #     # - Nginx retries automatically
# # #     # =====================================================

# # #     upstream backend_upstream {
# # #         server backend:5000 max_fails=5 fail_timeout=10s;
# # #     }

# # #     upstream superset_upstream {
# # #         server superset:8088 max_fails=5 fail_timeout=10s;
# # #     }

# # #     upstream frontend_upstream {
# # #         server frontend:3000 max_fails=5 fail_timeout=10s;
# # #     }

# # #     # =====================================================
# # #     # SERVER
# # #     # =====================================================

# # #     server {
# # #         listen 80;
# # #         server_name _;

# # #         # -------------------------------------------------
# # #         # Security headers
# # #         # -------------------------------------------------
# # #         add_header X-Content-Type-Options nosniff always;
# # #         add_header X-Frame-Options SAMEORIGIN always;
# # #         add_header X-XSS-Protection "1; mode=block" always;

# # #         # =================================================
# # #         # BACKEND API
# # #         # =================================================
# # #         location /api/ {
# # #             # Strip /api before forwarding
# # #             rewrite ^/api/(.*)$ /$1 break;

# # #             proxy_pass http://backend_upstream;
# # #             proxy_http_version 1.1;

# # #             proxy_set_header Host              $host;
# # #             proxy_set_header X-Real-IP         $remote_addr;
# # #             proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
# # #             proxy_set_header X-Forwarded-Proto $scheme;

# # #             proxy_set_header Upgrade    $http_upgrade;
# # #             proxy_set_header Connection $connection_upgrade;

# # #             proxy_connect_timeout 5s;
# # #             proxy_read_timeout 60s;

# # #             proxy_next_upstream error timeout http_502 http_503 http_504;
# # #             proxy_redirect off;
# # #         }

# # #         # =================================================
# # #         # SUPERSET STATIC ASSETS
# # #         # =================================================
# # #         location ~ ^/superset/static/(.*)$ {
# # #             proxy_pass http://superset_upstream/static/$1;

# # #             proxy_set_header Host              $host;
# # #             proxy_set_header X-Real-IP         $remote_addr;
# # #             proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
# # #             proxy_set_header X-Forwarded-Proto $scheme;

# # #             expires 1y;
# # #             add_header Cache-Control "public, immutable";

# # #             proxy_cookie_path / /superset/;
# # #             proxy_redirect off;
# # #         }

# # #         # =================================================
# # #         # SUPERSET APP
# # #         # =================================================
# # #         location /superset/ {
# # #             rewrite ^/superset/(.*)$ /$1 break;

# # #             proxy_pass http://superset_upstream;
# # #             proxy_http_version 1.1;

# # #             proxy_set_header Host              $host;
# # #             proxy_set_header X-Real-IP         $remote_addr;
# # #             proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
# # #             proxy_set_header X-Forwarded-Proto $scheme;
# # #             proxy_set_header X-Script-Name     /superset;

# # #             proxy_set_header Upgrade    $http_upgrade;
# # #             proxy_set_header Connection $connection_upgrade;

# # #             proxy_connect_timeout 5s;
# # #             proxy_read_timeout 300s;

# # #             proxy_next_upstream error timeout http_502 http_503 http_504;
# # #             proxy_cookie_path / /superset/;
# # #             proxy_redirect off;
# # #         }

# # #         # =================================================
# # #         # FRONTEND (React SPA)
# # #         # =================================================
# # #         location / {
# # #             proxy_pass http://frontend_upstream;
# # #             proxy_http_version 1.1;

# # #             proxy_set_header Host              $host;
# # #             proxy_set_header X-Real-IP         $remote_addr;
# # #             proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
# # #             proxy_set_header X-Forwarded-Proto $scheme;

# # #             proxy_next_upstream error timeout http_502 http_503 http_504;
# # #             proxy_redirect off;
# # #         }

# # #         # =================================================
# # #         # HEALTH CHECK
# # #         # =================================================
