#   Frontend: frontend-4o0b:3000
#   Superset: superset-qvgc:8088
# =======================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # -------------------------------------------------
    # FIXED: DNS Resolver for Render (Google DNS)
    # -------------------------------------------------
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss 
               application/rss+xml font/truetype font/opentype 
               application/vnd.ms-fontobject image/svg+xml;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name _;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # =================================================
        # BACKEND API
        # =================================================
        location /api/ {
            # FIXED: Use actual Render service address
            set $backend_upstream http://backend-yf9d.onrender.com:5000;
            rewrite ^/api/(.*)$ /$1 break;

            proxy_pass $backend_upstream;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_connect_timeout 60s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;

            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 5;
            proxy_next_upstream_timeout 30s;

            proxy_request_buffering off;
            proxy_redirect off;
        }

        # =================================================
        # SUPERSET STATIC
        # =================================================
        location ~ ^/superset/static/(.*)$ {
            # FIXED: Use actual Render service address
            set $superset_upstream http://superset-qvgc.onrender.com:8088;
            proxy_pass http://superset-qvgc.onrender.com:8088/static/$1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            expires 1y;
            add_header Cache-Control "public, immutable";

            proxy_cookie_path / /superset/;
            proxy_redirect off;
        }

        # =================================================
        # SUPERSET APP
        # =================================================
        location /superset/ {
            # FIXED: Use actual Render service address
            set $superset_upstream http://superset-qvgc.onrender.com:8088;
            rewrite ^/superset/(.*)$ /$1 break;

            proxy_pass $superset_upstream;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Script-Name /superset;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;

            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 5;
            proxy_next_upstream_timeout 30s;

            proxy_buffering off;
            proxy_request_buffering off;

            proxy_redirect off;
            proxy_cookie_path / /superset/;
        }

        # =================================================
        # FRONTEND
        # =================================================
        location / {
            # FIXED: Use actual Render service address
            set $frontend_upstream http://frontend-4o0b.onrender.com:3000;
            proxy_pass $frontend_upstream;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 15s;

            proxy_redirect off;
        }

        # =================================================
        # HEALTH CHECK (GATEWAY ONLY)
        # =================================================
        location /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "healthy\n";
        }

        error_page 502 503 504 = /service-unavailable.html;

        location = /service-unavailable.html {
            root /usr/share/nginx/html;
            internal;
        }
    }
}