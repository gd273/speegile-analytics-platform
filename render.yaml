services:
  # -----------------------------------------------------------------------
  # 1. GATEWAY (The ONLY Public Service)
  # -----------------------------------------------------------------------
  - type: web
    name: gateway
    runtime: docker
    rootDir: .
    dockerfilePath: Dockerfile.gateway
    plan: starter
    envVars:
      - key: PORT
        value: 80

  # -----------------------------------------------------------------------
  # 2. FRONTEND (Private Service)
  # -----------------------------------------------------------------------
  - type: pserv
    name: frontend
    runtime: docker
    rootDir: frontend
    dockerfilePath: Dockerfile
    plan: starter
    envVars:
      - key: PORT
        value: 3000
      # Nginx Gateway handles the routing, so we use relative paths now!
      - key: REACT_APP_API_BASE_URL
        value: /api
      - key: REACT_APP_SUPERSET_BASE_URL
        value: /superset

  # -----------------------------------------------------------------------
  # 3. BACKEND (Private Service)
  # -----------------------------------------------------------------------
  - type: pserv
    name: backend
    runtime: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    plan: starter
    envVars:
      - key: PORT
        value: 5000
      - key: APP_DATABASE_URL
        fromDatabase:
          name: shared-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: shared-redis
          property: connectionString
      - key: SUPERSET_URL
        value: "http://superset:8088"
      - key: FLASK_ENV
        value: production
      - key: SUPERSET_ADMIN_USERNAME
        value: admin
      - key: SUPERSET_ADMIN_PASSWORD
        sync: false
      - key: GUEST_TOKEN_JWT_SECRET
        sync: false
      - key: CORS_ALLOW_ORIGINS
        value: "*"

  # -----------------------------------------------------------------------
  # 4. SUPERSET (Private Service)
  # -----------------------------------------------------------------------
  - type: pserv
    name: superset
    runtime: docker
    rootDir: .
    dockerfilePath: Dockerfile
    dockerCommand: sh superset-init.sh
    envVars:
      - key: PORT
        value: 8088
      - key: DATABASE_URL
        fromDatabase:
          name: shared-postgres
          property: connectionString
      - key: SQLALCHEMY_DATABASE_URI
        fromDatabase:
          name: shared-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: shared-redis
          property: connectionString
      - key: SUPERSET_SECRET_KEY
        generateValue: false
      - key: SUPERSET_ADMIN_USERNAME
        value: admin
      - key: SUPERSET_ADMIN_PASSWORD
        sync: false
      - key: GUEST_TOKEN_JWT_SECRET
        sync: false

  # -----------------------------------------------------------------------
  # 5. DATA STORES
  # -----------------------------------------------------------------------
  - type: redis
    name: shared-redis
    plan: free
    ipAllowList: []

databases:
  - name: shared-postgres
    plan: free
    databaseName: superset
    user: superset