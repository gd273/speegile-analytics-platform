# =======================================================================
# ROOT NGINX CONFIGURATION (patched)
# =======================================================================
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss 
               application/rss+xml font/truetype font/opentype 
               application/vnd.ms-fontobject image/svg+xml;

    # Dynamic connection header for websocket support
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name _;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # ---------------------------
        # BACKEND API (/api/*)
        # ---------------------------
        # NOTE: This block STRIPS /api/ before proxying.
        # Make sure Flask routes are defined *without* the /api prefix
        # (recommended), OR remove the rewrite below if you want Flask to keep /api routes.
        location /api/ {
            rewrite ^/api/(.*)$ /$1 break;

            proxy_pass http://backend-n3m9.onrender.com:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_connect_timeout 600;
            proxy_send_timeout 600;
            proxy_read_timeout 600;
            send_timeout 600;

            proxy_request_buffering off;

            # Prevent nginx from rewriting Location headers unexpectedly
            proxy_redirect off;
        }

        # ---------------------------
        # SUPERSET STATIC
        # ---------------------------
        location ~ ^/superset/static/(.*)$ {
            proxy_pass http://superset-iak5.onrender.com:8088/static/$1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            expires 1y;
            add_header Cache-Control "public, immutable";

            # If Superset sets cookies for '/' they won't match /superset. Rewrite cookie path.
            proxy_cookie_path / /superset/;
            proxy_redirect off;
        }

        # ---------------------------
        # SUPERSET APP
        # ---------------------------
        location /superset/ {
            rewrite ^/superset/(.*)$ /$1 break;

            proxy_pass http://superset-iak5.onrender.com:8088;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # required so Superset knows it's mounted at /superset
            proxy_set_header X-Script-Name /superset;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_connect_timeout 300;
            proxy_send_timeout 300;
            proxy_read_timeout 300;

            proxy_buffering off;
            proxy_request_buffering off;

            # Ensure redirects sent by Superset don't point to "/" and that cookies map under /superset
            proxy_redirect off;
            proxy_cookie_path / /superset/;
        }

        # ---------------------------
        # FRONTEND (React SPA)
        # ---------------------------
        # location / {
        #     proxy_pass http://frontend:3000;
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto $scheme;

        #     proxy_http_version 1.1;
        #     proxy_set_header Upgrade $http_upgrade;
        #     proxy_set_header Connection $connection_upgrade;

        #     proxy_connect_timeout 60;
        #     proxy_send_timeout 60;
        #     proxy_read_timeout 60;
        #     proxy_redirect off;
        # }

        # Health check
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}