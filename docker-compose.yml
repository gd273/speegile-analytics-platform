version: '3.8'
services:
  # --- 1. ROOT PROXY ---
  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
      - superset

  # --- 2. Frontend ---
  frontend:
    build:
      context: ./frontend
      args:
        - REACT_APP_API_BASE_URL=/api
        - REACT_APP_SUPERSET_BASE_URL=/superset
    restart: always
    expose:
      - "3000"
    depends_on:
      - backend

  # --- 3. Backend ---
  backend:
    build: ./backend
    restart: always
    expose:
      - "5000"
    environment:
      - APP_DATABASE_URL
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - AWS_REGION
      - S3_BUCKET_NAME
      - REDIS_URL
      - FLASK_ENV
      - FLASK_SECRET_KEY
      - SUPERSET_URL
      - SUPERSET_ADMIN_USERNAME
      - SUPERSET_ADMIN_PASSWORD
      - GUEST_TOKEN_JWT_SECRET
      - CORS_ALLOW_ORIGINS
    depends_on:
      - redis

  # --- 4. Superset ---
  superset:
    build: .
    restart: always
    expose:
      - "8088"
    environment:
      - SUPERSET_SECRET_KEY
      - SQLALCHEMY_DATABASE_URI
      - REDIS_URL
      - SUPERSET_ADMIN_USERNAME
      - SUPERSET_ADMIN_PASSWORD
      - SUPERSET_ADMIN_EMAIL
      - FLASK_ENV
      - GUEST_TOKEN_JWT_SECRET
      - FRONTEND_URL
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # --- 5. Redis ---
  redis:
    image: redis:7
    restart: always
    expose:
      - "6379"